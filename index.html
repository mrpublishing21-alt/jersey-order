<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #a8d5ba;
    color: #333;
    line-height: 1.6;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #1a1a2e;
    margin-bottom: 30px;
    font-size: 2rem;
  }

  /* League buttons */
  .league-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 30px;
  }

  .league-btn {
    padding: 12px 24px;
    border: none;
    background: #1b4332;
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s ease;
  }

  .league-btn:hover {
    background: #2d6a4f;
    transform: translateY(-2px);
  }

  .league-btn.active {
    background: #e94560;
    color: white;
  }

  /* Team grid */
  .team-grid {
    display: none;
    margin-bottom: 30px;
  }

  .team-grid.show {
    display: block;
  }

  .team-grid h2 {
    text-align: center;
    color: #1a1a2e;
    margin-bottom: 20px;
    font-size: 1.5rem;
  }

  .teams-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .team-link {
    padding: 10px 20px;
    background: white;
    border: 2px solid #e94560;
    color: #e94560;
    font-weight: 600;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s ease;
    text-decoration: none;
  }

  .team-link:hover {
    background: #e94560;
    color: white;
  }

  /* Jersey display */
  .jersey-display-area {
    display: none;
    margin-bottom: 30px;
  }

  .jersey-display-area.show {
    display: block;
  }

  .jersey-display-area h2 {
    text-align: center;
    color: #1a1a2e;
    margin-bottom: 20px;
    font-size: 1.5rem;
  }

  .jerseys-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .jersey-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }

  .jersey-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.15);
  }

  .jersey-card.selected {
    border: 3px solid #e94560;
  }

  .jersey-card img {
    width: 100%;
    height: 280px;
    object-fit: contain;
    background: #f8f9fa;
    padding: 10px;
  }

  .jersey-info {
    padding: 15px;
  }

  .jersey-name {
    font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 8px;
    font-size: 0.9rem;
  }

  .jersey-price {
    color: #e94560;
    font-weight: 700;
    font-size: 1.1rem;
  }

  .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    color: white;
  }

  .badge-home { background: #3498db; }
  .badge-away { background: #e74c3c; }
  .badge-third { background: #2ecc71; }
  .badge-fourth { background: #9b59b6; }
  .badge-player { background: #f39c12; top: 40px; }

  /* Order form */
  .order-section {
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    color: #1b4332;
  }

  .order-section h2 {
    margin-bottom: 20px;
    font-size: 1.5rem;
  }

  .order-section h3 {
    margin-bottom: 10px;
  }

  .form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 15px;
  }

  .form-group label {
    display: block;
    font-weight: 600;
    color: #1b4332;
    margin-bottom: 5px;
    font-size: 0.9rem;
  }

  .form-group select,
  .form-group input {
    width: 100%;
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 6px;
    font-size: 1rem;
  }

  .form-group select:focus,
  .form-group input:focus {
    outline: none;
    border-color: #e94560;
  }

  /* Selected jerseys list */
  .selected-jerseys {
    margin-top: 20px;
  }

  .selected-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    background: #f8f9fa;
    border-radius: 6px;
    margin-bottom: 8px;
  }

  .selected-item img {
    width: 50px;
    height: 50px;
    object-fit: contain;
    border-radius: 4px;
  }

  .btn-primary {
    padding: 12px 30px;
    background: #e94560;
    color: white;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s ease;
  }

  .btn-primary:hover {
    background: #c73e54;
  }

  .btn-secondary {
    padding: 12px 30px;
    background: #ddd;
    color: #333;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s ease;
  }

  .btn-secondary:hover {
    background: #ccc;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  @media (max-width: 768px) {
    .jerseys-grid {
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    }
    
    h1 { font-size: 1.5rem; }
  }
</style>
</head>

<body>
  <div class="container">
    <h1>Soccer Jersey Order Form</h1>
    <p style="text-align: center; color: #666; margin-bottom: 30px;">Select a league, then a team to browse jerseys. Click jerseys to add them to your order.</p>

    <!-- League buttons -->
    <div class="league-buttons">
      <button class="league-btn" onclick="showTeamGrid('Premier League')">Premier League</button>
      <button class="league-btn" onclick="showTeamGrid('La Liga')">La Liga</button>
      <button class="league-btn" onclick="showTeamGrid('Bundesliga')">Bundesliga</button>
      <button class="league-btn" onclick="showTeamGrid('Ligue 1')">Ligue 1</button>
      <button class="league-btn" onclick="showTeamGrid('Serie A')">Serie A</button>
      <button class="league-btn" onclick="showTeamGrid('MLS')">MLS</button>
      <button class="league-btn" onclick="showTeamGrid('Mexico Liga')">Mexico Liga</button>
      <button class="league-btn" onclick="showTeamGrid('Other American & Asia Clubs')">Other American & Asia Clubs</button>
      <button class="league-btn" onclick="showTeamGrid('Brasileiro Série A')">Brasileiro Série A</button>
      <button class="league-btn" onclick="showTeamGrid('Primeira Liga & Eredivisie')">Primeira Liga & Eredivisie</button>
      <button class="league-btn" onclick="showTeamGrid('Other European Clubs')">Other European Clubs</button>
      <button class="league-btn" onclick="showTeamGrid('National Team')">National Team</button>
    </div>

    <!-- Team grid (hidden until league button clicked) -->
    <div id="team-grid" class="team-grid">
      <h2 id="grid-title"></h2>
      <div id="teams-row" class="teams-row"></div>
    </div>

    <!-- Jersey display area (hidden until team link clicked) -->
    <div id="jersey-display-area" class="jersey-display-area">
      <h2 id="jerseys-title"></h2>
      <div id="jerseys-grid" class="jerseys-grid"></div>
    </div>

    <!-- Order form -->
    <div class="order-section">
      <h2>Order Details</h2>
      
      <div class="selected-jerseys">
        <h3 style="margin-bottom: 10px; color: #1a1a2e;">Selected Jerseys</h3>
        <p id="no-selection" style="color: #999;">Click on jerseys above to add them here</p>
        <div id="selected-list"></div>
      </div>

      <form id="order-form" style="margin-top: 20px;">
        <div class="form-row">
          <div class="form-group" style="flex: 1;">
            <label for="customer-name">Customer Full Name *</label>
            <input type="text" id="customer-name" placeholder="Your full name" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          </div>
          <div class="form-group" style="flex: 1;">
            <label for="customer-email">Email Address *</label>
            <input type="email" id="customer-email" placeholder="your@email.com" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          </div>
        </div>

        <hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;">

        <div class="form-row">
          <div class="form-group">
            <label for="league-select">League</label>
            <select id="league-select" disabled>
              <option value="">Auto-detected</option>
            </select>
          </div>

          <div class="form-group">
            <label for="team-name">Team Name</label>
            <input type="text" id="team-name" placeholder="Auto-filled" disabled>
          </div>

          <div class="form-group">
            <label for="variant-type">Variant Type</label>
            <select id="variant-type">
              <option value="">Select variant...</option>
              <option value="Home">Home</option>
              <option value="Away">Away</option>
              <option value="Third">Third</option>
              <option value="Fourth">Fourth</option>
            </select>
          </div>

          <div class="form-group">
            <label for="style-select">Style</label>
            <select id="style-select">
              <option value="">Select style...</option>
              <option value="Fan">Fan Version</option>
              <option value="Player">Player Version</option>
            </select>
          </div>

          <div class="form-group">
            <label for="size-select">Size</label>
            <select id="size-select">
              <option value="">Select size...</option>
              <option value="S">S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
              <option value="XXL">XXL</option>
            </select>
          </div>

          <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" min="1" value="1">
          </div>
        </div>

        <div style="margin-top: 15px;">
          <h4 style="color: #999; margin-bottom: 8px; font-weight: normal;">(Optional) Add Name &/or Number to Back (+$5.00)</h4>
        </div>

        <div class="form-row">
          <div class="form-group" style="flex: 2;">
            <label for="custom-name">Custom Name on Back</label>
            <input type="text" id="custom-name" placeholder="e.g., SMITH" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          </div>
          <div class="form-group" style="flex: 1;">
            <label for="custom-number">Number</label>
            <input type="text" id="custom-number" placeholder="e.g., 10" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-primary" onclick="generateOrderSummary()">Generate Order Summary</button>
          <button type="button" class="btn-secondary" onclick="clearAll()">Clear All</button>
        </div>
      </form>
    </div>
  </div>

let selectedJerseys = [];
let currentLeague = '';
let currentTeam = '';

function showTeamGrid(leagueName) {
  // Hide jersey display if open
  document.getElementById('jersey-display-area').classList.remove('show');
  
  // Update active button
  const buttons = document.querySelectorAll('.league-btn');
  buttons.forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  currentLeague = leagueName;
  const data = allJerseyData[leagueName];
  
  if (!data || !data.teams) {
    alert('No teams loaded for ' + leagueName);
    return;
  }

  // Set title and populate team links
  document.getElementById('grid-title').textContent = leagueName + ' Teams';
  const teamsRow = document.getElementById('teams-row');
  teamsRow.innerHTML = '';

  data.teams.forEach(team => {
    const link = document.createElement('a');
    link.className = 'team-link';
    link.href = '#';
    link.textContent = team;
    link.onclick = (e) => {
      e.preventDefault();
      showTeamJerseys(leagueName, team);
    };

    teamsRow.appendChild(link);
  });

  // Show the grid
  document.getElementById('team-grid').classList.add('show');
}

function showTeamJerseys(leagueName, teamName) {
  currentLeague = leagueName;
  currentTeam = teamName;

  const data = allJerseyData[leagueName];
  if (!data || !data.jerseys || !data.jerseys[teamName]) {
    alert('No jerseys found for ' + teamName);
    return;
  }

  // Hide team grid, show jersey area
  document.getElementById('team-grid').classList.remove('show');
  const jerseyArea = document.getElementById('jersey-display-area');
  jerseyArea.classList.add('show');
  document.getElementById('jerseys-title').textContent = teamName + ' Jerseys';

  const jerseysGrid = document.getElementById('jerseys-grid');
  jerseysGrid.innerHTML = '';

  data.jerseys[teamName].forEach(jersey => {
    const card = document.createElement('div');
    card.className = 'jersey-card';
    card.onclick = () => toggleJerseySelection(card, jersey);

    // Badges
    let badges = '';
    if (jersey.variant_type === 'Home') badges += '<span class="badge badge-home">HOME</span>';
    else if (jersey.variant_type === 'Away') badges += '<span class="badge badge-away">AWAY</span>';
    else if (jersey.variant_type === 'Third') badges += '<span class="badge badge-third">THIRD</span>';
    else if (jersey.variant_type === 'Fourth') badges += '<span class="badge badge-fourth">FOURTH</span>';

    if (jersey.style === 'Player') {
      badges += '<span class="badge badge-player" style="top: 40px;">PLAYER</span>';
    }

    card.innerHTML = `
      ${badges}
      <img src="${jersey.image}" alt="${jersey.name}" loading="lazy">
      <div class="jersey-info">
        <div class="jersey-name">${jersey.name}</div>
        <div class="jersey-price">${jersey.price || '$14.50'}</div>
      </div>
    `;

    jerseysGrid.appendChild(card);
  });

  // Auto-fill form with first jersey's data as defaults
  const firstJersey = data.jerseys[teamName][0];
  if (firstJersey) {
    document.getElementById('league-select').value = leagueName;
    document.getElementById('team-name').value = teamName;
    document.getElementById('variant-type').value = firstJersey.variant_type || '';
    document.getElementById('style-select').value = firstJersey.style || '';
  }
}

function toggleJerseySelection(card, jersey) {
  const index = selectedJerseys.findIndex(s => s.name === jersey.name);
  
  if (index >= 0) {
    selectedJerseys.splice(index, 1);
    card.classList.remove('selected');
  } else {
    selectedJerseys.push(jersey);
    card.classList.add('selected');
  }

  // Auto-fill form with this jersey's data
  document.getElementById('league-select').value = currentLeague;
  document.getElementById('team-name').value = currentTeam;
  document.getElementById('variant-type').value = jersey.variant_type || '';
  document.getElementById('style-select').value = jersey.style || '';

  updateSelectedList();
}

function updateSelectedList() {
  const list = document.getElementById('selected-list');
  const noSel = document.getElementById('no-selection');
  
  if (selectedJerseys.length === 0) {
    noSel.style.display = 'block';
    list.innerHTML = '';
    return;
  }

  noSel.style.display = 'none';
  list.innerHTML = '';

  selectedJerseys.forEach((jersey, idx) => {
    const item = document.createElement('div');
    item.className = 'selected-item';
    item.innerHTML = `
      <img src="${jersey.image}" alt="">
      <span>${jersey.name}</span>
      <button onclick="removeSelected(${idx})" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">×</button>
    `;
    list.appendChild(item);
  });
}

function removeSelected(index) {
  selectedJerseys.splice(index, 1);
  updateSelectedList();
  // Remove visual selection from card
  const cards = document.querySelectorAll('.jersey-card');
  cards.forEach(card => {
    const nameEl = card.querySelector('.jersey-name');
    if (nameEl && nameEl.textContent === selectedJerseys[index]?.name) {
      card.classList.remove('selected');
    }
  });
}

function generateOrderSummary() {
  if (selectedJerseys.length === 0) {
    alert('Please select at least one jersey.');
    return;
  }

  const variant = document.getElementById('variant-type').value || 'Home';
  const style = document.getElementById('style-select').value || 'Fan';
  const size = document.getElementById('size-select').value || 'M';
  const quantity = document.getElementById('quantity').value || 1;
  const customName = document.getElementById('custom-name').value.trim();
  const customNumber = document.getElementById('custom-number').value.trim();
  const hasCustomization = customName || customNumber;

  let body = `ORDER DETAILS\n`;
  body += `===============\n\n`;
  body += `League: ${currentLeague}\n`;
  body += `Team: ${currentTeam}\n`;
  body += `Variant: ${variant}\n`;
  body += `Style: ${style}\n`;
  body += `Size: ${size}\n`;
  body += `Quantity per item: ${quantity}\n`;
  if (hasCustomization) {
    let customText = '';
    if (customName) customText += customName;
    if (customNumber) {
      if (customText) customText += ' ';
      customText += '#' + customNumber;
    }
    body += `Back Customization: ${customText} (extra $5 per jersey)\n`;
  }
  body += `\n`;
  body += `Selected Items:\n`;
  body += `---------------\n`;

  let totalPrice = 0;
  selectedJerseys.forEach((jersey, idx) => {
    let price = parseFloat((jersey.price || '$14.50').replace('$', ''));
    if (hasCustomization) {
      price += 5;
    }
    const lineTotal = price * parseInt(quantity);
    totalPrice += lineTotal;
    body += `\n${idx + 1}. ${jersey.name}\n`;
    body += `   Price: $${price.toFixed(2)} x ${quantity} = $${lineTotal.toFixed(2)}\n`;
  });

  body += `\nTOTAL: $${totalPrice.toFixed(2)}\n`;

  const customerName = document.getElementById('customer-name').value.trim();
  const customerEmail = document.getElementById('customer-email').value.trim();
  
  if (!customerName || !customerEmail) {
    alert('Please enter your name and email address.');
    return;
  }

  body += `\nCUSTOMER INFO:\n`;
  body += `===============\n`;
  body += `Name: ${customerName}\n`;
  body += `Email: ${customerEmail}\n`;

  // Send to Google Apps Script (replace URL after you create the form)
  const scriptURL = 'https://script.google.com/macros/s/AKfycbyxRkOMR_MjSj4plPCJcDjLsxOsn-muj3oGkIR4p6WPTeCI1L8HQuvrsPZmwRzT7gOF/exec';
  
  fetch(scriptURL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: body
  })
  .then(() => alert('Order submitted successfully!'))
  .catch((error) => console.error('Error:', error));
}

function clearAll() {
  selectedJerseys = [];
  currentLeague = '';
  currentTeam = '';
  
  document.getElementById('selected-list').innerHTML = '';
  document.getElementById('no-selection').style.display = 'block';
  document.getElementById('team-name').value = '';
  document.getElementById('variant-type').value = '';
  document.getElementById('style-select').value = '';
  document.getElementById('size-select').value = '';
  document.getElementById('quantity').value = '1';
  
  document.querySelectorAll('.jersey-card').forEach(card => card.classList.remove('selected'));
  document.getElementById('team-grid').classList.remove('show');
  document.getElementById('jersey-display-area').classList.remove('show');
}
